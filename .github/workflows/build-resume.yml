name: Build Resume PDF

on:
  push:
    branches: [main]
    paths:
      - 'resume.tex'
      - 'README.md'
      - '.github/workflows/build-resume.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resume-pdf-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
      - name: Publish both CV filenames
        run: |
          test -s resume.pdf
          cp resume.pdf Haoyang_Jiang_CV.pdf
          cp resume.pdf Haoyang_Jiang_Resume.pdf
          cmp Haoyang_Jiang_CV.pdf Haoyang_Jiang_Resume.pdf
          sha256sum Haoyang_Jiang_CV.pdf Haoyang_Jiang_Resume.pdf
      - name: Commit and push generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Haoyang_Jiang_CV.pdf Haoyang_Jiang_Resume.pdf
          if git diff --cached --quiet; then
            echo "PDFs are already up to date."
            exit 0
          fi
          git commit -m "Build general professional CV PDF"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Save CV artifact
        uses: actions/upload-artifact@v4
        with:
          name: Haoyang-Jiang-Professional-CV
          path: Haoyang_Jiang_CV.pdf
